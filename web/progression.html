<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makros - Progression</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            gap: 20px;
        }
        h1 {
            text-align: center;
            color: #4ecca3;
            margin: 0;
        }
        .back-btn {
            background: #0f3460;
            color: #4ecca3;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .back-btn:hover {
            background: #1a4a7a;
        }
        .video-section {
            margin-bottom: 30px;
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
        }
        .video-section h2 {
            color: #4ecca3;
            font-size: 18px;
            margin-bottom: 12px;
            text-align: center;
        }
        .video-section video {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            display: block;
            margin: 0 auto 12px;
        }
        .video-meta {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .video-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .generate-btn {
            background: #4ecca3;
            color: #0a0a23;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .generate-btn:hover {
            background: #3db88c;
        }
        .generate-btn:disabled {
            background: #2a5a4a;
            color: #666;
            cursor: not-allowed;
        }
        .delete-video-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .delete-video-btn:hover {
            background: #c0392b;
        }
        .loading-spinner {
            text-align: center;
            padding: 20px;
            color: #4ecca3;
        }
        .loading-spinner .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #333;
            border-top-color: #4ecca3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
        .photo-card {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }
        .photo-card:hover {
            outline: 2px solid #4ecca3;
        }
        .photo-card img {
            width: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            display: block;
        }
        .photo-card .debug-img {
            border-top: 2px solid #4ecca3;
        }
        .photo-card .date-label {
            padding: 8px;
            text-align: center;
            font-size: 13px;
            color: #888;
        }
        .debug-btn {
            background: #0f3460;
            color: #4ecca3;
            border: 1px solid #4ecca3;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .debug-btn:hover {
            background: #1a4a7a;
        }
        .debug-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .empty {
            text-align: center;
            color: #888;
            padding: 40px 20px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
        }
        .modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            background: transparent;
            color: white;
            border: none;
            font-size: 36px;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <a href="/" class="back-btn">&larr; Back</a>
            <h1>Progression</h1>
        </div>
        <div id="video-section" class="video-section" style="display:none;">
            <h2>Progress Video</h2>
            <div id="video-content"></div>
        </div>
        <div id="debug-section" style="text-align:center; margin-bottom:20px; display:none;">
            <button class="debug-btn" onclick="generateDebug()">Generate Debug Images</button>
            <span id="debug-status" style="margin-left:12px; color:#888; font-size:13px;"></span>
        </div>
        <div id="photo-grid" class="photo-grid">
            <div class="empty">Loading...</div>
        </div>
    </div>

    <div id="image-modal" class="modal" onclick="closeModal()">
        <button class="close-btn">&times;</button>
        <img id="modal-image" src="" alt="Progress photo">
    </div>

    <script>
        let photoCount = 0;
        let photoDates = [];
        let showDebug = false;

        async function loadPhotos() {
            const grid = document.getElementById('photo-grid');
            try {
                const res = await fetch('/api/progress-photos');
                const data = await res.json();

                if (!data.dates || data.dates.length === 0) {
                    grid.innerHTML = '<div class="empty">No progress photos yet</div>';
                    photoCount = 0;
                    document.getElementById('debug-section').style.display = 'none';
                    loadVideoSection();
                    return;
                }

                photoCount = data.dates.length;
                photoDates = data.dates;

                if (photoCount >= 2) {
                    document.getElementById('debug-section').style.display = 'block';
                }

                renderGrid();
                loadVideoSection();
            } catch (e) {
                grid.innerHTML = '<div class="empty">Failed to load photos</div>';
            }
        }

        function renderGrid() {
            const grid = document.getElementById('photo-grid');
            const cacheBuster = showDebug ? `&_t=${Date.now()}` : '';
            grid.innerHTML = photoDates.map(dateStr => {
                const d = new Date(dateStr + 'T00:00:00');
                const label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                const debugImg = showDebug
                    ? `<img class="debug-img" src="/api/progress-photo/debug?date=${dateStr}${cacheBuster}" alt="Debug ${label}" loading="lazy" onclick="viewPhoto('${dateStr}', true)" onerror="this.style.display='none'">`
                    : '';
                return `
                    <div class="photo-card">
                        <img src="/api/progress-photo?date=${dateStr}" alt="${label}" loading="lazy" onclick="viewPhoto('${dateStr}')">
                        ${debugImg}
                        <div class="date-label">${label}</div>
                    </div>
                `;
            }).join('');
        }

        async function generateDebug() {
            const btn = document.querySelector('.debug-btn');
            const status = document.getElementById('debug-status');
            btn.disabled = true;
            status.textContent = 'Generating...';

            try {
                const res = await fetch('/api/progress-photos/debug', {
                    method: 'POST',
                    signal: AbortSignal.timeout(120000),
                });
                if (!res.ok) {
                    const text = await res.text();
                    let msg = text;
                    try { msg = JSON.parse(text).detail || msg; } catch {}
                    throw new Error(msg);
                }
                const data = await res.json();
                status.textContent = `Done (${data.ms}ms)`;
                showDebug = true;
                renderGrid();
            } catch (e) {
                status.textContent = `Failed: ${e.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        async function loadVideoSection() {
            const section = document.getElementById('video-section');
            const content = document.getElementById('video-content');

            try {
                const res = await fetch('/api/progress-video/info');
                const info = await res.json();

                if (info.exists) {
                    const firstD = new Date(info.first_date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    const lastD = new Date(info.last_date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    const createdD = new Date(info.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                    content.innerHTML = `
                        <video controls playsinline>
                            <source src="/api/progress-video" type="video/mp4">
                            Your browser does not support video playback.
                        </video>
                        <div class="video-meta">${firstD} &rarr; ${lastD} &middot; Generated ${createdD}</div>
                        <div class="video-actions">
                            <button class="generate-btn" onclick="generateVideo()">Regenerate</button>
                            <button class="delete-video-btn" onclick="deleteVideo()">Delete Video</button>
                        </div>
                    `;
                    section.style.display = 'block';
                } else if (photoCount >= 2) {
                    content.innerHTML = `
                        <div class="video-actions">
                            <button class="generate-btn" onclick="generateVideo()">Generate Progress Video</button>
                        </div>
                    `;
                    section.style.display = 'block';
                } else {
                    section.style.display = 'none';
                }
            } catch (e) {
                console.error('Failed to load video info:', e);
                section.style.display = 'none';
            }
        }

        async function generateVideo() {
            const content = document.getElementById('video-content');

            content.innerHTML = `
                <div class="loading-spinner">
                    <span class="spinner"></span>
                    Generating progress video... This takes a few seconds.
                </div>
            `;

            try {
                const res = await fetch('/api/progress-video/generate', {
                    method: 'POST',
                    signal: AbortSignal.timeout(360000),
                });

                if (!res.ok) {
                    const text = await res.text();
                    let msg = text || 'Generation failed';
                    try { msg = JSON.parse(text).detail || msg; } catch {}
                    throw new Error(msg);
                }

                await loadVideoSection();
            } catch (e) {
                content.innerHTML = `
                    <div class="loading-spinner" style="color: #e74c3c;">
                        Failed to generate video: ${e.message}
                    </div>
                    <div class="video-actions" style="margin-top: 12px;">
                        <button class="generate-btn" onclick="generateVideo()">Try Again</button>
                    </div>
                `;
            }
        }

        async function deleteVideo() {
            if (!confirm('Delete the progress video?')) return;

            try {
                const res = await fetch('/api/progress-video', { method: 'DELETE' });
                if (res.ok) {
                    await loadVideoSection();
                }
            } catch (e) {
                alert('Failed to delete video');
            }
        }

        function viewPhoto(dateStr, debug = false) {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('modal-image');
            img.src = debug
                ? `/api/progress-photo/debug?date=${dateStr}`
                : `/api/progress-photo?date=${dateStr}`;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('image-modal').classList.remove('active');
        }

        document.getElementById('modal-image').addEventListener('click', (e) => {
            e.stopPropagation();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        loadPhotos();
    </script>
</body>
</html>
