<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makros - Weight Progress</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            gap: 20px;
        }
        h1 {
            text-align: center;
            color: #4ecca3;
        }
        .back-btn {
            background: #0f3460;
            color: #4ecca3;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover {
            background: #1a4a7a;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .time-toggles {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .toggle-btn {
            background: #0f3460;
            color: #888;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn:hover {
            background: #1a4a7a;
            color: #eee;
        }
        .toggle-btn.active {
            background: #4ecca3;
            color: #1a1a2e;
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        .stats-row {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: #0f3460;
            padding: 15px 20px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }
        .stat-box .value {
            font-size: 24px;
            font-weight: 700;
            color: #4ecca3;
        }
        .stat-box .label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .stat-box .value.positive {
            color: #ff4757;
        }
        .stat-box .value.negative {
            color: #4ecca3;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state p {
            margin-bottom: 10px;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 600px) {
            .chart-container {
                height: 300px;
            }
            .stat-box {
                min-width: 100px;
            }
            .stat-box .value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">&larr; Back</a>
            <h1>Weight Progress</h1>
            <div style="width: 80px;"></div>
        </div>

        <div class="card">
            <div class="time-toggles">
                <button class="toggle-btn active" data-days="30">1 Month</button>
                <button class="toggle-btn" data-days="90">3 Months</button>
                <button class="toggle-btn" data-days="365">1 Year</button>
                <button class="toggle-btn" data-days="all">All Time</button>
            </div>

            <div class="chart-container">
                <canvas id="weight-chart"></canvas>
            </div>
            <div class="empty-state hidden" id="empty-state">
                <p>No weight data yet</p>
                <p>Start logging your morning weight on the main page</p>
            </div>

            <div class="stats-row" id="stats-row">
                <div class="stat-box">
                    <div class="value" id="stat-current">--</div>
                    <div class="label">Current</div>
                </div>
                <div class="stat-box">
                    <div class="value" id="stat-start">--</div>
                    <div class="label">Start</div>
                </div>
                <div class="stat-box">
                    <div class="value" id="stat-change">--</div>
                    <div class="label">Change</div>
                </div>
                <div class="stat-box">
                    <div class="value" id="stat-min">--</div>
                    <div class="label">Lowest</div>
                </div>
                <div class="stat-box">
                    <div class="value" id="stat-max">--</div>
                    <div class="label">Highest</div>
                </div>
            </div>
        </div>

        <!-- Detailed Macros Chart -->
        <div class="card">
            <h2 style="color: #4ecca3; margin-bottom: 20px;">Daily Macros</h2>
            <div class="chart-container">
                <canvas id="macros-chart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let chart = null;
        let macrosChart = null;
        let currentDays = 30;

        async function loadWeightData(days) {
            const url = days === 'all' ? '/api/weight/history' : `/api/weight/history?days=${days}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.history || [];
            } catch (e) {
                console.error('Failed to load weight data:', e);
                return [];
            }
        }

        async function loadCaloriesData(days) {
            const url = days === 'all' ? '/api/daily/history' : `/api/daily/history?days=${days}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.history || [];
            } catch (e) {
                console.error('Failed to load calories data:', e);
                return [];
            }
        }

        async function loadMacrosData(days) {
            const url = days === 'all' ? '/api/daily/macros-history' : `/api/daily/macros-history?days=${days}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.history || [];
            } catch (e) {
                console.error('Failed to load macros data:', e);
                return [];
            }
        }

        function updateStats(data) {
            const statsRow = document.getElementById('stats-row');
            const emptyState = document.getElementById('empty-state');

            if (data.length === 0) {
                statsRow.style.display = 'none';
                emptyState.classList.remove('hidden');
                return;
            }

            statsRow.style.display = 'flex';
            emptyState.classList.add('hidden');

            const weights = data.map(d => d.weight_lbs);
            const current = weights[weights.length - 1];
            const start = weights[0];
            const change = current - start;
            const min = Math.min(...weights);
            const max = Math.max(...weights);

            document.getElementById('stat-current').textContent = current.toFixed(1);
            document.getElementById('stat-start').textContent = start.toFixed(1);

            const changeEl = document.getElementById('stat-change');
            changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(1);
            changeEl.className = 'value ' + (change > 0 ? 'positive' : change < 0 ? 'negative' : '');

            document.getElementById('stat-min').textContent = min.toFixed(1);
            document.getElementById('stat-max').textContent = max.toFixed(1);
        }

        function renderChart(weightData, caloriesData) {
            const ctx = document.getElementById('weight-chart').getContext('2d');
            const canvas = document.getElementById('weight-chart');

            if (weightData.length === 0 && caloriesData.length === 0) {
                canvas.style.display = 'none';
                return;
            }
            canvas.style.display = 'block';

            // Use {x, y} format with actual dates for proper time-based spacing
            // Use noon (T12:00:00) to avoid timezone boundary issues
            const weightChartData = weightData.map(d => ({
                x: new Date(d.date + 'T12:00:00'),
                y: d.weight_lbs
            }));

            const caloriesChartData = caloriesData.map(d => ({
                x: new Date(d.date + 'T12:00:00'),
                y: d.calories
            }));

            // Calculate calories axis bounds
            const caloriesValues = caloriesData.map(d => d.calories);
            const minCalories = caloriesValues.length > 0 ? Math.min(...caloriesValues) : 1500;
            const maxCalories = caloriesValues.length > 0 ? Math.max(...caloriesValues) : 3000;
            const caloriesMin = Math.min(minCalories, 1500);
            const caloriesMax = Math.max(maxCalories, 3000);

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Weight (lbs)',
                        data: weightChartData,
                        borderColor: '#4ecca3',
                        backgroundColor: 'rgba(78, 204, 163, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointHoverRadius: 8,
                        pointBackgroundColor: '#4ecca3',
                        pointHoverBackgroundColor: '#fff',
                        pointBorderColor: '#4ecca3',
                        pointHoverBorderColor: '#4ecca3',
                        pointBorderWidth: 2,
                        pointHoverBorderWidth: 3,
                        yAxisID: 'y',
                    }, {
                        label: 'Calories',
                        data: caloriesChartData,
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#ff6b6b',
                        pointHoverBackgroundColor: '#fff',
                        pointBorderColor: '#ff6b6b',
                        pointHoverBorderColor: '#ff6b6b',
                        pointBorderWidth: 2,
                        pointHoverBorderWidth: 3,
                        yAxisID: 'y1',
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#888',
                                usePointStyle: true,
                                padding: 20,
                            }
                        },
                        tooltip: {
                            backgroundColor: '#16213e',
                            titleColor: '#eee',
                            bodyColor: '#eee',
                            borderColor: '#4ecca3',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            titleFont: {
                                size: 14,
                            },
                            bodyFont: {
                                size: 14,
                                weight: 'bold',
                            },
                            callbacks: {
                                title: function(context) {
                                    const date = new Date(context[0].parsed.x);
                                    return date.toLocaleDateString('en-US', {
                                        weekday: 'short',
                                        month: 'short',
                                        day: 'numeric',
                                        year: 'numeric'
                                    });
                                },
                                label: function(context) {
                                    if (context.dataset.label === 'Weight (lbs)') {
                                        return ' ' + context.parsed.y.toFixed(1) + ' lbs';
                                    } else {
                                        return ' ' + context.parsed.y + ' kcal';
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    day: 'MMM d'
                                },
                                tooltipFormat: 'MMM d, yyyy'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                            },
                            ticks: {
                                color: '#888',
                                maxTicksLimit: 10,
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                            },
                            ticks: {
                                color: '#4ecca3',
                                callback: function(value) {
                                    return value.toFixed(0);
                                }
                            },
                            title: {
                                display: true,
                                text: 'Weight (lbs)',
                                color: '#4ecca3',
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            min: caloriesMin,
                            max: caloriesMax,
                            grid: {
                                drawOnChartArea: false,
                            },
                            ticks: {
                                color: '#ff6b6b',
                                callback: function(value) {
                                    return value.toFixed(0);
                                }
                            },
                            title: {
                                display: true,
                                text: 'Calories',
                                color: '#ff6b6b',
                            }
                        }
                    }
                }
            });
        }

        function renderMacrosChart(macrosData) {
            const ctx = document.getElementById('macros-chart').getContext('2d');
            const canvas = document.getElementById('macros-chart');

            if (macrosData.length === 0) {
                canvas.style.display = 'none';
                return;
            }
            canvas.style.display = 'block';

            // Define colors for each nutrient
            const colors = {
                protein: '#4ecca3',      // green
                carbs: '#ffd93d',        // yellow
                fat: '#ff6b6b',          // red
                fiber: '#6bcb77',        // light green
                alcohol: '#9b59b6',      // purple
                saturated_fat: '#e74c3c', // dark red
                sodium: '#3498db',       // blue
                cholesterol: '#f39c12',  // orange
                added_sugar: '#e91e63',  // pink
            };

            // Create datasets for main macros (protein, carbs, fat)
            const datasets = [
                {
                    label: 'Protein (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.protein })),
                    borderColor: colors.protein,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 3,
                    pointHoverRadius: 6,
                },
                {
                    label: 'Carbs (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.carbs })),
                    borderColor: colors.carbs,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 3,
                    pointHoverRadius: 6,
                },
                {
                    label: 'Fat (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.fat })),
                    borderColor: colors.fat,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 3,
                    pointHoverRadius: 6,
                },
                {
                    label: 'Fiber (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.fiber })),
                    borderColor: colors.fiber,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                },
                {
                    label: 'Sat Fat (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.saturated_fat })),
                    borderColor: colors.saturated_fat,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                },
                {
                    label: 'Added Sugar (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.added_sugar })),
                    borderColor: colors.added_sugar,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                },
            ];

            if (macrosChart) {
                macrosChart.destroy();
            }

            macrosChart = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#888',
                                usePointStyle: true,
                                padding: 15,
                            }
                        },
                        tooltip: {
                            backgroundColor: '#16213e',
                            titleColor: '#eee',
                            bodyColor: '#eee',
                            borderColor: '#4ecca3',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            callbacks: {
                                title: function(context) {
                                    const date = new Date(context[0].parsed.x);
                                    return date.toLocaleDateString('en-US', {
                                        weekday: 'short',
                                        month: 'short',
                                        day: 'numeric'
                                    });
                                },
                                label: function(context) {
                                    return ' ' + context.dataset.label + ': ' + context.parsed.y.toFixed(1);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    day: 'MMM d'
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                            },
                            ticks: {
                                color: '#888',
                                maxTicksLimit: 10,
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                            },
                            ticks: {
                                color: '#888',
                            },
                            title: {
                                display: true,
                                text: 'Grams',
                                color: '#888',
                            }
                        }
                    }
                }
            });
        }

        async function updateChart(days) {
            currentDays = days;
            const [weightData, caloriesData, macrosData] = await Promise.all([
                loadWeightData(days),
                loadCaloriesData(days),
                loadMacrosData(days)
            ]);
            renderChart(weightData, caloriesData);
            renderMacrosChart(macrosData);
            updateStats(weightData);
        }

        // Toggle button handlers
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const days = btn.dataset.days;
                updateChart(days === 'all' ? 'all' : parseInt(days));
            });
        });

        // Initial load
        updateChart(30);
    </script>
</body>
</html>
