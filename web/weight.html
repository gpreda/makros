<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makros - Weight Progress</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            gap: 20px;
        }
        h1 {
            text-align: center;
            color: #4ecca3;
        }
        .back-btn {
            background: #0f3460;
            color: #4ecca3;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover {
            background: #1a4a7a;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .time-toggles {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .toggle-btn {
            background: #0f3460;
            color: #888;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn:hover {
            background: #1a4a7a;
            color: #eee;
        }
        .toggle-btn.active {
            background: #4ecca3;
            color: #1a1a2e;
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state p {
            margin-bottom: 10px;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 600px) {
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">&larr; Back</a>
            <h1>Weight Progress</h1>
            <div style="width: 80px;"></div>
        </div>

        <div class="card">
            <div class="time-toggles">
                <button class="toggle-btn active" data-days="30">1 Month</button>
                <button class="toggle-btn" data-days="90">3 Months</button>
                <button class="toggle-btn" data-days="365">1 Year</button>
                <button class="toggle-btn" data-days="all">All Time</button>
            </div>

            <div class="chart-container">
                <canvas id="weight-chart"></canvas>
            </div>
            <div class="empty-state hidden" id="empty-state">
                <p>No weight data yet</p>
                <p>Start logging your morning weight on the main page</p>
            </div>
        </div>

        <!-- Averages & Target Chart -->
        <div class="card">
            <h2 style="color: #4ecca3; margin-bottom: 20px;">Averages & Target</h2>
            <div class="chart-container">
                <canvas id="averages-chart"></canvas>
            </div>
        </div>

        <!-- Detailed Macros Chart -->
        <div class="card">
            <h2 style="color: #4ecca3; margin-bottom: 20px;">Daily Macros</h2>
            <div class="time-toggles" id="macros-time-toggles">
                <button class="toggle-btn active" data-days="30">1 Month</button>
                <button class="toggle-btn" data-days="90">3 Months</button>
                <button class="toggle-btn" data-days="365">1 Year</button>
                <button class="toggle-btn" data-days="all">All Time</button>
            </div>
            <div class="chart-container">
                <canvas id="macros-chart"></canvas>
            </div>
        </div>

        <div style="text-align: center; margin-top: 10px;">
            <a href="/items" class="back-btn" style="display: inline-block;">Items Database</a>
        </div>
    </div>

    <script>
        let chart = null;
        let averagesChart = null;
        let macrosChart = null;
        let currentDays = 30;
        let currentMacrosDays = 30;

        async function loadWeightData(days) {
            const url = days === 'all' ? '/api/weight/history' : `/api/weight/history?days=${days}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.history || [];
            } catch (e) {
                console.error('Failed to load weight data:', e);
                return [];
            }
        }

        async function loadCaloriesData(days) {
            const url = days === 'all' ? '/api/daily/history' : `/api/daily/history?days=${days}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.history || [];
            } catch (e) {
                console.error('Failed to load calories data:', e);
                return [];
            }
        }

        async function loadCaloricTargetData(days) {
            const url = days === 'all' ? '/api/caloric-target/history' : `/api/caloric-target/history?days=${days}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.history || [];
            } catch (e) {
                console.error('Failed to load caloric target data:', e);
                return [];
            }
        }

        function computeRollingAverage(caloriesData, windowSize = 7) {
            if (caloriesData.length === 0) return [];

            // Build date-to-calories map
            const dateMap = {};
            caloriesData.forEach(d => { dateMap[d.date] = d.calories; });

            // Get sorted dates to determine range
            const dates = caloriesData.map(d => d.date).sort();
            const startDate = new Date(dates[0] + 'T12:00:00');
            const endDate = new Date(dates[dates.length - 1] + 'T12:00:00');

            // Generate complete calendar date range
            const allDates = [];
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                allDates.push(`${yyyy}-${mm}-${dd}`);
            }

            // Compute rolling average with sliding window
            const result = [];
            let windowSum = 0;
            for (let i = 0; i < allDates.length; i++) {
                const cal = dateMap[allDates[i]] || 0;
                windowSum += cal;
                if (i >= windowSize) {
                    windowSum -= (dateMap[allDates[i - windowSize]] || 0);
                }
                if (i >= windowSize - 1) {
                    result.push({
                        x: new Date(allDates[i] + 'T12:00:00'),
                        y: Math.round(windowSum / windowSize)
                    });
                }
            }
            return result;
        }

        async function loadMacrosData(days) {
            const url = days === 'all' ? '/api/daily/macros-history' : `/api/daily/macros-history?days=${days}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.history || [];
            } catch (e) {
                console.error('Failed to load macros data:', e);
                return [];
            }
        }

        function computeRollingWeightAverage(weightData, windowSize = 7) {
            if (weightData.length === 0) return [];

            const dateMap = {};
            weightData.forEach(d => { dateMap[d.date] = d.weight_lbs; });

            const dates = weightData.map(d => d.date).sort();
            const startDate = new Date(dates[0] + 'T12:00:00');
            const endDate = new Date(dates[dates.length - 1] + 'T12:00:00');

            const allDates = [];
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                allDates.push(`${yyyy}-${mm}-${dd}`);
            }

            const result = [];
            const window = [];
            for (let i = 0; i < allDates.length; i++) {
                const val = dateMap[allDates[i]];
                if (val !== undefined) {
                    window.push(val);
                    if (window.length > windowSize) window.shift();
                }
                if (window.length > 0 && i >= windowSize - 1) {
                    const avg = window.reduce((a, b) => a + b, 0) / window.length;
                    result.push({
                        x: new Date(allDates[i] + 'T12:00:00'),
                        y: parseFloat(avg.toFixed(1))
                    });
                }
            }
            return result;
        }

        function renderChart(weightData, caloriesData, targetData) {
            const ctx = document.getElementById('weight-chart').getContext('2d');
            const canvas = document.getElementById('weight-chart');

            const emptyState = document.getElementById('empty-state');
            if (weightData.length === 0 && caloriesData.length === 0) {
                canvas.style.display = 'none';
                emptyState.classList.remove('hidden');
                return;
            }
            canvas.style.display = 'block';
            emptyState.classList.add('hidden');

            // Use {x, y} format with actual dates for proper time-based spacing
            // Use noon (T12:00:00) to avoid timezone boundary issues
            const weightChartData = weightData.map(d => ({
                x: new Date(d.date + 'T12:00:00'),
                y: d.weight_lbs
            }));

            const caloriesChartData = caloriesData.map(d => ({
                x: new Date(d.date + 'T12:00:00'),
                y: d.calories
            }));

            // Calculate calories axis bounds
            const caloriesValues = caloriesData.map(d => d.calories);
            const minCalories = caloriesValues.length > 0 ? Math.min(...caloriesValues) : 1500;
            const maxCalories = caloriesValues.length > 0 ? Math.max(...caloriesValues) : 3000;
            const caloriesMin = Math.min(minCalories, 1500);
            const caloriesMax = Math.max(maxCalories, 3000);

            if (chart) {
                chart.destroy();
            }

            const datasets = [{
                label: 'Weight (lbs)',
                data: weightChartData,
                borderColor: '#4ecca3',
                backgroundColor: 'rgba(78, 204, 163, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointHoverRadius: 8,
                pointBackgroundColor: '#4ecca3',
                pointHoverBackgroundColor: '#fff',
                pointBorderColor: '#4ecca3',
                pointHoverBorderColor: '#4ecca3',
                pointBorderWidth: 2,
                pointHoverBorderWidth: 3,
                yAxisID: 'y',
            }, {
                label: 'Calories',
                data: caloriesChartData,
                borderColor: '#ff6b6b',
                backgroundColor: 'rgba(255, 107, 107, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                pointRadius: 3,
                pointHoverRadius: 6,
                pointBackgroundColor: '#ff6b6b',
                pointHoverBackgroundColor: '#fff',
                pointBorderColor: '#ff6b6b',
                pointHoverBorderColor: '#ff6b6b',
                pointBorderWidth: 2,
                pointHoverBorderWidth: 3,
                yAxisID: 'y1',
            }];

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#888',
                                usePointStyle: true,
                                padding: 20,
                            }
                        },
                        tooltip: {
                            backgroundColor: '#16213e',
                            titleColor: '#eee',
                            bodyColor: '#eee',
                            borderColor: '#4ecca3',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            titleFont: {
                                size: 14,
                            },
                            bodyFont: {
                                size: 14,
                                weight: 'bold',
                            },
                            callbacks: {
                                title: function(context) {
                                    const date = new Date(context[0].parsed.x);
                                    return date.toLocaleDateString('en-US', {
                                        weekday: 'short',
                                        month: 'short',
                                        day: 'numeric',
                                        year: 'numeric'
                                    });
                                },
                                label: function(context) {
                                    if (context.dataset.label === 'Weight (lbs)') {
                                        return ' ' + context.parsed.y.toFixed(1) + ' lbs';
                                    } else {
                                        return ' ' + context.parsed.y + ' kcal';
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    day: 'MMM d'
                                },
                                tooltipFormat: 'MMM d, yyyy'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                            },
                            ticks: {
                                color: '#888',
                                maxTicksLimit: 10,
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                            },
                            ticks: {
                                color: '#4ecca3',
                                callback: function(value) {
                                    return value.toFixed(0);
                                }
                            },
                            title: {
                                display: true,
                                text: 'Weight (lbs)',
                                color: '#4ecca3',
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            min: caloriesMin,
                            max: caloriesMax,
                            grid: {
                                drawOnChartArea: false,
                            },
                            ticks: {
                                color: '#ff6b6b',
                                callback: function(value) {
                                    return value.toFixed(0);
                                }
                            },
                            title: {
                                display: true,
                                text: 'Calories',
                                color: '#ff6b6b',
                            }
                        }
                    }
                }
            });
        }

        function renderAveragesChart(weightData, caloriesData, targetData) {
            const ctx = document.getElementById('averages-chart').getContext('2d');
            const canvas = document.getElementById('averages-chart');

            const rollingAvgCalories = computeRollingAverage(caloriesData);
            const rollingAvgWeight = computeRollingWeightAverage(weightData);

            // Build step-line data from sparse caloric target change-points
            let targetChartData = [];
            if (targetData && targetData.length > 0) {
                const allDates = [
                    ...caloriesData.map(d => d.date),
                    ...weightData.map(d => d.date)
                ].sort();
                const endDate = allDates.length > 0 ? allDates[allDates.length - 1] : targetData[targetData.length - 1].date;

                for (let i = 0; i < targetData.length; i++) {
                    const point = targetData[i];
                    targetChartData.push({
                        x: new Date(point.date + 'T12:00:00'),
                        y: point.target_calories
                    });
                    if (i < targetData.length - 1) {
                        const nextDate = new Date(targetData[i + 1].date + 'T12:00:00');
                        nextDate.setDate(nextDate.getDate() - 1);
                        targetChartData.push({
                            x: nextDate,
                            y: point.target_calories
                        });
                    } else {
                        targetChartData.push({
                            x: new Date(endDate + 'T12:00:00'),
                            y: point.target_calories
                        });
                    }
                }
            }

            if (rollingAvgCalories.length === 0 && rollingAvgWeight.length === 0 && targetChartData.length === 0) {
                canvas.style.display = 'none';
                return;
            }
            canvas.style.display = 'block';

            if (averagesChart) {
                averagesChart.destroy();
            }

            const datasets = [];

            if (rollingAvgCalories.length > 0) {
                datasets.push({
                    label: '7-Day Avg Calories',
                    data: rollingAvgCalories,
                    borderColor: '#ff9f43',
                    backgroundColor: 'transparent',
                    borderWidth: 3,
                    fill: false,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 5,
                    pointBackgroundColor: '#ff9f43',
                    yAxisID: 'y',
                });
            }

            if (targetChartData.length > 0) {
                datasets.push({
                    label: 'Caloric Target',
                    data: targetChartData,
                    borderColor: '#ffd93d',
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    borderDash: [6, 4],
                    fill: false,
                    stepped: true,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    pointBackgroundColor: '#ffd93d',
                    yAxisID: 'y',
                });
            }

            if (rollingAvgWeight.length > 0) {
                datasets.push({
                    label: '7-Day Avg Weight (lbs)',
                    data: rollingAvgWeight,
                    borderColor: '#4ecca3',
                    backgroundColor: 'rgba(78, 204, 163, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 5,
                    pointBackgroundColor: '#4ecca3',
                    yAxisID: 'y1',
                });
            }

            averagesChart = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#888',
                                usePointStyle: true,
                                padding: 20,
                            }
                        },
                        tooltip: {
                            backgroundColor: '#16213e',
                            titleColor: '#eee',
                            bodyColor: '#eee',
                            borderColor: '#4ecca3',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            callbacks: {
                                title: function(context) {
                                    const date = new Date(context[0].parsed.x);
                                    return date.toLocaleDateString('en-US', {
                                        weekday: 'short',
                                        month: 'short',
                                        day: 'numeric',
                                        year: 'numeric'
                                    });
                                },
                                label: function(context) {
                                    if (context.dataset.label === '7-Day Avg Weight (lbs)') {
                                        return ' 7d Avg: ' + context.parsed.y.toFixed(1) + ' lbs';
                                    } else if (context.dataset.label === '7-Day Avg Calories') {
                                        return ' 7d Avg: ' + context.parsed.y + ' kcal';
                                    } else if (context.dataset.label === 'Caloric Target') {
                                        return ' Target: ' + context.parsed.y + ' kcal';
                                    }
                                    return ' ' + context.parsed.y;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    day: 'MMM d'
                                },
                                tooltipFormat: 'MMM d, yyyy'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                            },
                            ticks: {
                                color: '#888',
                                maxTicksLimit: 10,
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                            },
                            ticks: {
                                color: '#ff9f43',
                                callback: function(value) {
                                    return value.toFixed(0);
                                }
                            },
                            title: {
                                display: true,
                                text: 'Calories',
                                color: '#ff9f43',
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            grid: {
                                drawOnChartArea: false,
                            },
                            ticks: {
                                color: '#4ecca3',
                                callback: function(value) {
                                    return value.toFixed(1);
                                }
                            },
                            title: {
                                display: true,
                                text: 'Weight (lbs)',
                                color: '#4ecca3',
                            }
                        }
                    }
                }
            });
        }

        function renderMacrosChart(macrosData) {
            const ctx = document.getElementById('macros-chart').getContext('2d');
            const canvas = document.getElementById('macros-chart');

            if (macrosData.length === 0) {
                canvas.style.display = 'none';
                return;
            }
            canvas.style.display = 'block';

            // Define colors for each nutrient
            const colors = {
                protein: '#4ecca3',      // green
                carbs: '#ffd93d',        // yellow
                fat: '#ff6b6b',          // red
                fiber: '#6bcb77',        // light green
                alcohol: '#9b59b6',      // purple
                saturated_fat: '#e74c3c', // dark red
                sodium: '#3498db',       // blue
                cholesterol: '#f39c12',  // orange
                added_sugar: '#e91e63',  // pink
            };

            // Create datasets for main macros (protein, carbs, fat)
            const datasets = [
                {
                    label: 'Protein (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.protein })),
                    borderColor: colors.protein,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 3,
                    pointHoverRadius: 6,
                },
                {
                    label: 'Carbs (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.carbs })),
                    borderColor: colors.carbs,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 3,
                    pointHoverRadius: 6,
                },
                {
                    label: 'Fat (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.fat })),
                    borderColor: colors.fat,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 3,
                    pointHoverRadius: 6,
                },
                {
                    label: 'Fiber (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.fiber })),
                    borderColor: colors.fiber,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                },
                {
                    label: 'Sat Fat (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.saturated_fat })),
                    borderColor: colors.saturated_fat,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                },
                {
                    label: 'Added Sugar (g)',
                    data: macrosData.map(d => ({ x: new Date(d.date + 'T12:00:00'), y: d.added_sugar })),
                    borderColor: colors.added_sugar,
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                },
            ];

            if (macrosChart) {
                macrosChart.destroy();
            }

            macrosChart = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#888',
                                usePointStyle: true,
                                padding: 15,
                            }
                        },
                        tooltip: {
                            backgroundColor: '#16213e',
                            titleColor: '#eee',
                            bodyColor: '#eee',
                            borderColor: '#4ecca3',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            callbacks: {
                                title: function(context) {
                                    const date = new Date(context[0].parsed.x);
                                    return date.toLocaleDateString('en-US', {
                                        weekday: 'short',
                                        month: 'short',
                                        day: 'numeric'
                                    });
                                },
                                label: function(context) {
                                    return ' ' + context.dataset.label + ': ' + context.parsed.y.toFixed(1);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    day: 'MMM d'
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                            },
                            ticks: {
                                color: '#888',
                                maxTicksLimit: 10,
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)',
                            },
                            ticks: {
                                color: '#888',
                            },
                            title: {
                                display: true,
                                text: 'Grams',
                                color: '#888',
                            }
                        }
                    }
                }
            });
        }

        async function updateChart(days) {
            currentDays = days;
            const [weightData, caloriesData, targetData] = await Promise.all([
                loadWeightData(days),
                loadCaloriesData(days),
                loadCaloricTargetData(days)
            ]);
            renderChart(weightData, caloriesData, targetData);
            renderAveragesChart(weightData, caloriesData, targetData);
        }

        async function updateMacrosChart(days) {
            currentMacrosDays = days;
            const macrosData = await loadMacrosData(days);
            renderMacrosChart(macrosData);
        }

        // Toggle button handlers for weight chart
        document.querySelectorAll('.time-toggles:not(#macros-time-toggles) .toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-toggles:not(#macros-time-toggles) .toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const days = btn.dataset.days;
                updateChart(days === 'all' ? 'all' : parseInt(days));
            });
        });

        // Toggle button handlers for macros chart
        document.querySelectorAll('#macros-time-toggles .toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#macros-time-toggles .toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const days = btn.dataset.days;
                updateMacrosChart(days === 'all' ? 'all' : parseInt(days));
            });
        });

        // Initial load
        updateChart(30);
        updateMacrosChart(30);
    </script>
</body>
</html>
