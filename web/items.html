<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makros - Items Database</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            gap: 20px;
        }
        h1 {
            text-align: center;
            color: #4ecca3;
        }
        .back-btn {
            background: #0f3460;
            color: #4ecca3;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover {
            background: #1a4a7a;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 {
            margin-bottom: 15px;
            color: #4ecca3;
            font-size: 1.2em;
        }
        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-row input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: #eee;
            font-size: 16px;
        }
        .search-row input:focus {
            outline: 2px solid #4ecca3;
        }
        .search-row button, .btn {
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .search-row button:hover, .btn:hover {
            background: #3db892;
        }
        .btn-secondary {
            background: #0f3460;
            color: #4ecca3;
        }
        .btn-secondary:hover {
            background: #1a4a7a;
        }
        .stats {
            display: flex;
            gap: 15px;
            color: #888;
            font-size: 14px;
        }
        /* Add Item Form */
        .add-form {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #0f3460;
        }
        .add-form.show {
            display: block;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 12px;
            color: #888;
        }
        .form-group input {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #0f3460;
            color: #eee;
            font-size: 14px;
            width: 100px;
        }
        .form-group input:focus {
            outline: 2px solid #4ecca3;
        }
        .form-group.wide input {
            width: 200px;
        }
        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .form-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #0f3460;
        }
        th {
            color: #4ecca3;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background: #0f3460;
        }
        .item-name {
            font-weight: 600;
        }
        .item-desc {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .item-barcode {
            font-size: 11px;
            color: #666;
            font-family: monospace;
        }
        .nutrition-cell {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .unit-badge {
            background: #0f3460;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #4ecca3;
        }
        .action-cell {
            text-align: center;
            width: 50px;
        }
        .delete-btn {
            background: transparent;
            color: #666;
            border: none;
            padding: 4px 8px;
            margin: 0;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
            line-height: 1;
        }
        .delete-btn:hover {
            background: #ff4757;
            color: white;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .error {
            background: #ff4757;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .pagination button {
            background: #0f3460;
            color: #4ecca3;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .pagination button:hover:not(:disabled) {
            background: #1a4a7a;
        }
        .pagination button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .pagination .page-info {
            display: flex;
            align-items: center;
            color: #888;
            font-size: 14px;
        }
        @media (max-width: 800px) {
            th, td {
                padding: 8px 6px;
                font-size: 13px;
            }
            .nutrition-cell {
                font-size: 12px;
            }
            .form-group input {
                width: 80px;
            }
            .form-group.wide input {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">&larr; Back</a>
            <h1>Items Database</h1>
            <div style="width: 80px;"></div>
        </div>

        <div class="card">
            <div class="search-row">
                <input type="text" id="search-input" placeholder="Search items by name...">
                <button onclick="searchItems()">Search</button>
                <button class="btn-secondary" onclick="toggleAddForm()">+ Add Item</button>
            </div>
            <div class="stats" id="stats">
                Loading...
            </div>

            <div class="add-form" id="add-form">
                <div class="form-row">
                    <div class="form-group wide">
                        <label>Name *</label>
                        <input type="text" id="new-name" placeholder="Item name">
                    </div>
                    <div class="form-group">
                        <label>Unit</label>
                        <input type="text" id="new-unit" placeholder="g" value="g">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Calories</label>
                        <input type="number" id="new-calories" placeholder="0" step="1">
                    </div>
                    <div class="form-group">
                        <label>Protein (g)</label>
                        <input type="number" id="new-protein" placeholder="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Carbs (g)</label>
                        <input type="number" id="new-carbs" placeholder="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Fat (g)</label>
                        <input type="number" id="new-fat" placeholder="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Fiber (g)</label>
                        <input type="number" id="new-fiber" placeholder="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Alcohol (g)</label>
                        <input type="number" id="new-alcohol" placeholder="0" step="0.1">
                    </div>
                </div>
                <div class="form-buttons">
                    <button class="btn" onclick="addItem()">Save Item</button>
                    <button class="btn btn-secondary" onclick="toggleAddForm()">Cancel</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div id="items-content">
                <div class="loading">Loading items...</div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        const PAGE_SIZE = 50;
        let currentOffset = 0;
        let totalItems = 0;
        let currentSearch = '';

        function toggleAddForm() {
            const form = document.getElementById('add-form');
            form.classList.toggle('show');
            if (form.classList.contains('show')) {
                document.getElementById('new-name').focus();
            }
        }

        async function addItem() {
            const name = document.getElementById('new-name').value.trim();
            if (!name) {
                alert('Name is required');
                return;
            }

            const item = {
                name: name,
                default_unit: document.getElementById('new-unit').value.trim() || 'g',
                calories: parseFloat(document.getElementById('new-calories').value) || 0,
                protein: parseFloat(document.getElementById('new-protein').value) || 0,
                carbs: parseFloat(document.getElementById('new-carbs').value) || 0,
                fat: parseFloat(document.getElementById('new-fat').value) || 0,
                fiber: parseFloat(document.getElementById('new-fiber').value) || 0,
                alcohol: parseFloat(document.getElementById('new-alcohol').value) || 0,
            };

            try {
                const res = await fetch('/api/items', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(item)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Failed to add item');
                }

                // Clear form and reload
                clearAddForm();
                toggleAddForm();
                loadItems(0, '');
            } catch (e) {
                alert(e.message);
            }
        }

        function clearAddForm() {
            document.getElementById('new-name').value = '';
            document.getElementById('new-unit').value = 'g';
            document.getElementById('new-calories').value = '';
            document.getElementById('new-protein').value = '';
            document.getElementById('new-carbs').value = '';
            document.getElementById('new-fat').value = '';
            document.getElementById('new-fiber').value = '';
            document.getElementById('new-alcohol').value = '';
        }

        async function deleteItem(id, name) {
            if (!confirm(`Delete "${name}"?`)) return;

            try {
                const res = await fetch(`/api/items/${id}`, {method: 'DELETE'});
                if (!res.ok) throw new Error('Failed to delete');
                loadItems(currentOffset, currentSearch);
            } catch (e) {
                alert('Failed to delete item');
            }
        }

        async function loadItems(offset = 0, search = '') {
            const content = document.getElementById('items-content');
            content.innerHTML = '<div class="loading">Loading items...</div>';

            try {
                let url = `/api/items?limit=${PAGE_SIZE}&offset=${offset}`;
                if (search) {
                    url = `/api/items?limit=${PAGE_SIZE}&search=${encodeURIComponent(search)}`;
                }

                const res = await fetch(url);
                const data = await res.json();

                totalItems = data.total;
                currentOffset = offset;
                currentSearch = search;

                updateStats(data.items.length, totalItems, search);

                if (data.items.length === 0) {
                    content.innerHTML = '<div class="empty">No items found</div>';
                    updatePagination();
                    return;
                }

                renderItems(data.items);
                updatePagination();
            } catch (e) {
                content.innerHTML = '<div class="error">Failed to load items</div>';
                console.error('Failed to load items:', e);
            }
        }

        function updateStats(shown, total, search) {
            const stats = document.getElementById('stats');
            if (search) {
                stats.textContent = `Found ${shown} items matching "${search}" (${total} total in database)`;
            } else if (total === 0) {
                stats.textContent = 'No items in database';
            } else {
                stats.textContent = `Showing ${currentOffset + 1}-${Math.min(currentOffset + shown, total)} of ${total} items`;
            }
        }

        function renderItems(items) {
            const content = document.getElementById('items-content');

            const rows = items.map(item => `
                <tr>
                    <td>
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
                        ${item.bar_code ? `<div class="item-barcode">${escapeHtml(item.bar_code)}</div>` : ''}
                    </td>
                    <td><span class="unit-badge">${item.default_unit || 'item'}</span></td>
                    <td class="nutrition-cell">${Math.round(item.calories || 0)}</td>
                    <td class="nutrition-cell">${(item.protein || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${(item.carbs || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${(item.fat || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${(item.fiber || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${(item.alcohol || 0).toFixed(1)}</td>
                    <td class="action-cell">
                        <button class="delete-btn" onclick="deleteItem(${item.id}, '${escapeHtml(item.name).replace(/'/g, "\\'")}')" title="Delete item">&times;</button>
                    </td>
                </tr>
            `).join('');

            content.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Unit</th>
                            <th>Kcal</th>
                            <th>Protein</th>
                            <th>Carbs</th>
                            <th>Fat</th>
                            <th>Fiber</th>
                            <th>Alcohol</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function updatePagination() {
            const pagination = document.getElementById('pagination');

            if (currentSearch || totalItems <= PAGE_SIZE) {
                pagination.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(totalItems / PAGE_SIZE);
            const currentPage = Math.floor(currentOffset / PAGE_SIZE) + 1;

            pagination.innerHTML = `
                <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
                <span class="page-info">Page ${currentPage} of ${totalPages}</span>
                <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
            `;
        }

        function goToPage(page) {
            const offset = (page - 1) * PAGE_SIZE;
            loadItems(offset, currentSearch);
        }

        function searchItems() {
            const search = document.getElementById('search-input').value.trim();
            loadItems(0, search);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Handle Enter key in search
        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchItems();
            }
        });

        // Initial load
        loadItems();
    </script>
</body>
</html>
