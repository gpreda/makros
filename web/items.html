<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makros - Items Database</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            gap: 20px;
        }
        h1 {
            text-align: center;
            color: #4ecca3;
        }
        .back-btn {
            background: #0f3460;
            color: #4ecca3;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover {
            background: #1a4a7a;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 {
            margin-bottom: 15px;
            color: #4ecca3;
            font-size: 1.2em;
        }
        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .search-row input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: #eee;
            font-size: 16px;
        }
        .search-row input:focus {
            outline: 2px solid #4ecca3;
        }
        .search-row button, .btn {
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .search-row button:hover, .btn:hover {
            background: #3db892;
        }
        .btn-secondary {
            background: #0f3460;
            color: #4ecca3;
        }
        .btn-secondary:hover {
            background: #1a4a7a;
        }
        .stats {
            display: flex;
            gap: 15px;
            color: #888;
            font-size: 14px;
        }
        /* Add Item Form */
        .add-form {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #0f3460;
        }
        .add-form.show {
            display: block;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 12px;
            color: #888;
        }
        .form-group input {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #0f3460;
            color: #eee;
            font-size: 14px;
            width: 100px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: 2px solid #4ecca3;
        }
        .form-group select {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #0f3460;
            color: #eee;
            font-size: 14px;
            width: 120px;
            cursor: pointer;
        }
        .form-group.wide input {
            width: 200px;
        }
        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .form-buttons button {
            padding: 10px 20px;
            font-size: 14px;
        }
        .add-form-header {
            font-size: 16px;
            margin-bottom: 10px;
            color: #eee;
        }
        .add-form-header strong {
            color: #4ecca3;
        }
        .suggest-status {
            font-size: 13px;
            padding: 8px 0;
            min-height: 20px;
        }
        .suggest-status.loading {
            color: #888;
        }
        .suggest-status.success {
            color: #4ecca3;
        }
        .suggest-status.warning {
            color: #ffa502;
        }
        .suggest-status.error {
            color: #ff4757;
        }
        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #0f3460;
        }
        th {
            color: #4ecca3;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background: #0f3460;
        }
        .item-name {
            font-weight: 600;
            cursor: pointer;
        }
        .item-name:hover {
            color: #4ecca3;
        }
        .item-name-input {
            background: #0f3460;
            color: #eee;
            border: 1px solid #4ecca3;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: inherit;
            font-weight: 600;
            font-family: inherit;
            width: 100%;
        }
        .item-name-input:focus {
            outline: none;
        }
        .item-desc {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .item-barcode {
            font-size: 11px;
            color: #666;
            font-family: monospace;
        }
        .nutrition-cell {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .unit-badge {
            background: #0f3460;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #4ecca3;
        }
        .created-cell {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }
        .sortable {
            cursor: pointer;
            user-select: none;
        }
        .sortable:hover {
            color: #eee;
        }
        .sort-arrow {
            font-size: 11px;
            margin-left: 4px;
        }
        .action-cell {
            text-align: center;
            width: 50px;
        }
        .delete-btn {
            background: transparent;
            color: #666;
            border: none;
            padding: 4px 8px;
            margin: 0;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
            line-height: 1;
        }
        .delete-btn:hover {
            background: #ff4757;
            color: white;
        }
        .check-cell {
            width: 36px;
            text-align: center;
        }
        .check-cell input[type="checkbox"],
        .check-cell input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4ecca3;
        }
        .group-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(78,204,163,0.4);
            z-index: 100;
            display: none;
        }
        .group-fab:hover {
            background: #3db892;
        }
        .group-view {
            display: none;
        }
        .group-view.show {
            display: block;
        }
        .group-view table {
            margin-bottom: 20px;
        }
        .group-view .selected-default {
            background: #0f3460;
        }
        .group-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .error {
            background: #ff4757;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .pagination button {
            background: #0f3460;
            color: #4ecca3;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .pagination button:hover:not(:disabled) {
            background: #1a4a7a;
        }
        .pagination button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
        .pagination .page-info {
            display: flex;
            align-items: center;
            color: #888;
            font-size: 14px;
        }
        @media (max-width: 800px) {
            th, td {
                padding: 8px 6px;
                font-size: 13px;
            }
            .nutrition-cell {
                font-size: 12px;
            }
            .form-group input {
                width: 80px;
            }
            .form-group.wide input {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">&larr; Back</a>
            <h1>Items Database</h1>
            <div style="width: 80px;"></div>
        </div>

        <div class="card">
            <div class="search-row">
                <input type="text" id="search-input" placeholder="Enter item name...">
                <button onclick="searchItems()">Search</button>
                <button class="btn-secondary" onclick="startAddItem()">+ Add Item</button>
            </div>
            <div class="stats" id="stats">
                Loading...
            </div>

            <div class="add-form" id="add-form">
                <div class="add-form-header">
                    <span>Adding: </span><strong id="new-item-name"></strong>
                </div>
                <div class="suggest-status" id="suggest-status"></div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Unit</label>
                        <select id="new-unit" onchange="onUnitChange()">
                            <option value="g">per 100g</option>
                            <option value="item">per item</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Calories</label>
                        <input type="number" id="new-calories" placeholder="0" step="1">
                    </div>
                    <div class="form-group">
                        <label>Protein (g)</label>
                        <input type="number" id="new-protein" placeholder="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Carbs (g)</label>
                        <input type="number" id="new-carbs" placeholder="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Fat (g)</label>
                        <input type="number" id="new-fat" placeholder="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Fiber (g)</label>
                        <input type="number" id="new-fiber" placeholder="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Alcohol (g)</label>
                        <input type="number" id="new-alcohol" placeholder="0" step="0.1">
                    </div>
                </div>
                <div class="form-buttons">
                    <button class="btn" onclick="addItem()">Save Item</button>
                    <button class="btn btn-secondary" onclick="hideAddForm()">Cancel</button>
                </div>
            </div>
        </div>

        <div class="card" id="items-card">
            <div id="items-content">
                <div class="loading">Loading items...</div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>

        <div class="card group-view" id="group-view">
            <h2>Group Duplicate Items</h2>
            <p style="color:#888;margin-bottom:15px;">Select which item to keep as the default. All meal references from the other items will be merged into it.</p>
            <div id="group-content"></div>
            <div class="group-actions">
                <button class="btn" id="commit-group-btn" onclick="commitGroup()">Commit Group</button>
                <button class="btn btn-secondary" onclick="cancelGroup()">Cancel</button>
            </div>
        </div>

        <button class="group-fab" id="group-fab" onclick="showGroupView()">Group (<span id="group-count">0</span>)</button>
    </div>

    <script>
        const PAGE_SIZE = 50;
        let currentOffset = 0;
        let totalItems = 0;
        let currentSearch = '';
        let currentSort = 'name';
        let currentDir = 'asc';

        let currentItemName = '';
        let currentSuggestion = null;

        // Selection state for grouping
        const selectedItems = new Map(); // id -> item object
        let groupDefaultId = null;

        async function startAddItem() {
            const name = document.getElementById('search-input').value.trim();
            if (!name) {
                alert('Enter an item name first');
                return;
            }

            currentItemName = name;
            currentSuggestion = null;
            document.getElementById('new-item-name').textContent = name;
            clearAddForm();

            const form = document.getElementById('add-form');
            form.classList.add('show');

            // Auto-lookup
            setSuggestStatus('Looking up...', 'loading');

            try {
                const res = await fetch('/api/items/suggest', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name})
                });

                const data = await res.json();
                currentSuggestion = data;
                const confidence = data.confidence || 0;
                const pct = Math.round(confidence * 100);

                if (confidence >= 0.7) {
                    // High confidence - fill in the values
                    const unit = data.recommended_unit || 'g';
                    document.getElementById('new-unit').value = unit;
                    fillFormWithUnit(unit);
                    const unitLabel = unit === 'item' ? 'per item' : 'per 100g';
                    setSuggestStatus(`Found! (${pct}% confidence) - Values ${unitLabel}. Change unit or edit if needed.`, 'success');
                } else if (confidence >= 0.4) {
                    // Medium confidence - fill but warn
                    const unit = data.recommended_unit || 'g';
                    document.getElementById('new-unit').value = unit;
                    fillFormWithUnit(unit);
                    setSuggestStatus(`Uncertain match (${pct}% confidence) - Please verify values.`, 'warning');
                } else {
                    // Low confidence - don't fill
                    document.getElementById('new-unit').value = 'g';
                    setSuggestStatus('Unknown item - please enter nutrition values manually.', 'warning');
                }
            } catch (e) {
                setSuggestStatus('Lookup failed - please enter values manually.', 'error');
            }
        }

        function fillFormWithUnit(unit) {
            if (!currentSuggestion) return;

            let values;
            if (unit === 'item' && currentSuggestion.per_item) {
                values = currentSuggestion.per_item;
            } else {
                values = currentSuggestion.per_100g;
            }

            if (values) {
                document.getElementById('new-calories').value = Math.round(values.calories || 0);
                document.getElementById('new-protein').value = (values.protein || 0).toFixed(1);
                document.getElementById('new-carbs').value = (values.carbs || 0).toFixed(1);
                document.getElementById('new-fat').value = (values.fat || 0).toFixed(1);
                document.getElementById('new-fiber').value = (values.fiber || 0).toFixed(1);
                document.getElementById('new-alcohol').value = (values.alcohol || 0).toFixed(1);
            }
        }

        function onUnitChange() {
            const unit = document.getElementById('new-unit').value;
            if (currentSuggestion) {
                if (unit === 'item' && !currentSuggestion.per_item) {
                    setSuggestStatus('No per-item data available. Values kept from per 100g.', 'warning');
                } else {
                    fillFormWithUnit(unit);
                    const unitLabel = unit === 'item' ? 'per item' : 'per 100g';
                    setSuggestStatus(`Showing values ${unitLabel}. Edit if needed.`, 'success');
                }
            }
        }

        function hideAddForm() {
            document.getElementById('add-form').classList.remove('show');
            currentItemName = '';
            currentSuggestion = null;
        }

        function clearSuggestStatus() {
            const status = document.getElementById('suggest-status');
            status.textContent = '';
            status.className = 'suggest-status';
        }

        function setSuggestStatus(message, type) {
            const status = document.getElementById('suggest-status');
            status.textContent = message;
            status.className = 'suggest-status ' + type;
        }

        async function addItem() {
            if (!currentItemName) {
                alert('No item name set');
                return;
            }

            const item = {
                name: currentItemName,
                default_unit: document.getElementById('new-unit').value.trim() || 'g',
                calories: parseFloat(document.getElementById('new-calories').value) || 0,
                protein: parseFloat(document.getElementById('new-protein').value) || 0,
                carbs: parseFloat(document.getElementById('new-carbs').value) || 0,
                fat: parseFloat(document.getElementById('new-fat').value) || 0,
                fiber: parseFloat(document.getElementById('new-fiber').value) || 0,
                alcohol: parseFloat(document.getElementById('new-alcohol').value) || 0,
            };

            try {
                const res = await fetch('/api/items', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(item)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Failed to add item');
                }

                // Clear form and reload
                hideAddForm();
                document.getElementById('search-input').value = '';
                loadItems(0, '');
            } catch (e) {
                alert(e.message);
            }
        }

        function clearAddForm() {
            document.getElementById('new-unit').value = 'g';
            document.getElementById('new-calories').value = '';
            document.getElementById('new-protein').value = '';
            document.getElementById('new-carbs').value = '';
            document.getElementById('new-fat').value = '';
            document.getElementById('new-fiber').value = '';
            document.getElementById('new-alcohol').value = '';
            clearSuggestStatus();
        }

        async function deleteItem(id, name) {
            if (!confirm(`Delete "${name}"?`)) return;

            try {
                const res = await fetch(`/api/items/${id}`, {method: 'DELETE'});
                if (!res.ok) throw new Error('Failed to delete');
                loadItems(currentOffset, currentSearch);
            } catch (e) {
                alert('Failed to delete item');
            }
        }

        async function loadItems(offset = 0, search = '') {
            const content = document.getElementById('items-content');
            content.innerHTML = '<div class="loading">Loading items...</div>';

            try {
                let url = `/api/items?limit=${PAGE_SIZE}&offset=${offset}&sort_by=${currentSort}&sort_dir=${currentDir}`;
                if (search) {
                    url = `/api/items?limit=${PAGE_SIZE}&search=${encodeURIComponent(search)}&sort_by=${currentSort}&sort_dir=${currentDir}`;
                }

                const res = await fetch(url);
                const data = await res.json();

                totalItems = data.total;
                currentOffset = offset;
                currentSearch = search;

                updateStats(data.items.length, totalItems, search);

                if (data.items.length === 0) {
                    content.innerHTML = '<div class="empty">No items found</div>';
                    updatePagination();
                    return;
                }

                renderItems(data.items);
                updatePagination();
            } catch (e) {
                content.innerHTML = '<div class="error">Failed to load items</div>';
                console.error('Failed to load items:', e);
            }
        }

        function updateStats(shown, total, search) {
            const stats = document.getElementById('stats');
            if (search) {
                stats.textContent = `Found ${shown} items matching "${search}" (${total} total in database)`;
            } else if (total === 0) {
                stats.textContent = 'No items in database';
            } else {
                stats.textContent = `Showing ${currentOffset + 1}-${Math.min(currentOffset + shown, total)} of ${total} items`;
            }
        }

        function renderItems(items) {
            const content = document.getElementById('items-content');

            // Store items in a lookup for selection
            window._itemsLookup = window._itemsLookup || {};
            items.forEach(item => { window._itemsLookup[item.id] = item; });

            const rows = items.map(item => `
                <tr>
                    <td class="check-cell">
                        <input type="checkbox" data-item-id="${item.id}"
                            ${selectedItems.has(item.id) ? 'checked' : ''}
                            onchange="toggleSelectItem(${item.id}, this.checked)">
                    </td>
                    <td>
                        <div class="item-name" onclick="startRename(${item.id}, this)">${escapeHtml(item.name)}</div>
                        ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
                        ${item.bar_code ? `<div class="item-barcode">${escapeHtml(item.bar_code)}</div>` : ''}
                    </td>
                    <td><span class="unit-badge">${item.default_unit || 'item'}</span></td>
                    <td class="nutrition-cell">${item.default_quantity || 0}</td>
                    <td class="nutrition-cell">${Math.round(item.calories || 0)}</td>
                    <td class="nutrition-cell">${(item.protein || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${(item.carbs || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${(item.fat || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${(item.fiber || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${(item.alcohol || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${item.meal_count || 0}</td>
                    <td class="created-cell">${formatCreatedAt(item.created_at)}</td>
                    <td class="action-cell">
                        <button class="delete-btn" onclick="deleteItem(${item.id}, '${escapeHtml(item.name).replace(/'/g, "\\'")}')" title="Delete item">&times;</button>
                    </td>
                </tr>
            `).join('');

            function sortArrow(col) {
                if (currentSort !== col) return '';
                return `<span class="sort-arrow">${currentDir === 'asc' ? '\u25B2' : '\u25BC'}</span>`;
            }

            content.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th class="check-cell"></th>
                            <th class="sortable" onclick="toggleSort('name')">Item${sortArrow('name')}</th>
                            <th>Unit</th>
                            <th>Qty</th>
                            <th>Kcal</th>
                            <th>Protein</th>
                            <th>Carbs</th>
                            <th>Fat</th>
                            <th>Fiber</th>
                            <th>Alcohol</th>
                            <th>Meals</th>
                            <th class="sortable" onclick="toggleSort('created_at')">Created${sortArrow('created_at')}</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function toggleSelectItem(id, checked) {
            if (checked) {
                selectedItems.set(id, window._itemsLookup[id]);
            } else {
                selectedItems.delete(id);
            }
            updateGroupFab();
        }

        function startRename(id, el) {
            const currentName = el.textContent;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'item-name-input';
            input.value = currentName;
            el.replaceWith(input);
            input.focus();
            input.select();

            let saved = false;
            async function save() {
                if (saved) return;
                saved = true;
                const newName = input.value.trim();
                if (!newName || newName === currentName) {
                    // Revert
                    const div = document.createElement('div');
                    div.className = 'item-name';
                    div.textContent = currentName;
                    div.onclick = () => startRename(id, div);
                    input.replaceWith(div);
                    return;
                }
                try {
                    const res = await fetch(`/api/items/${id}/name`, {
                        method: 'PATCH',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ name: newName })
                    });
                    if (!res.ok) {
                        let msg = 'Rename failed';
                        try { const err = await res.json(); msg = err.detail || msg; } catch {}
                        throw new Error(msg);
                    }
                    const div = document.createElement('div');
                    div.className = 'item-name';
                    div.textContent = newName;
                    div.onclick = () => startRename(id, div);
                    input.replaceWith(div);
                    // Update lookup
                    if (window._itemsLookup[id]) window._itemsLookup[id].name = newName;
                } catch (e) {
                    alert(e.message);
                    saved = false;
                }
            }

            input.addEventListener('blur', save);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                if (e.key === 'Escape') { saved = true; const div = document.createElement('div'); div.className = 'item-name'; div.textContent = currentName; div.onclick = () => startRename(id, div); input.replaceWith(div); }
            });
        }

        function updateGroupFab() {
            const fab = document.getElementById('group-fab');
            const count = selectedItems.size;
            document.getElementById('group-count').textContent = count;
            fab.style.display = count >= 2 ? 'block' : 'none';
        }

        function showGroupView() {
            const items = Array.from(selectedItems.values());
            // Default to the item with the most meals, but preserve existing selection
            const sorted = [...items].sort((a, b) => (b.meal_count || 0) - (a.meal_count || 0));
            if (!groupDefaultId || !selectedItems.has(groupDefaultId)) {
                groupDefaultId = sorted[0].id;
            }

            const rows = sorted.map(item => `
                <tr class="${item.id === groupDefaultId ? 'selected-default' : ''}">
                    <td class="check-cell">
                        <input type="radio" name="group-default" value="${item.id}"
                            ${item.id === groupDefaultId ? 'checked' : ''}
                            onchange="groupDefaultId = ${item.id}; renderGroupView();">
                    </td>
                    <td><div class="item-name">${escapeHtml(item.name)}</div></td>
                    <td><span class="unit-badge">${item.default_unit || 'item'}</span></td>
                    <td class="nutrition-cell">${Math.round(item.calories || 0)}</td>
                    <td class="nutrition-cell">${(item.protein || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${(item.carbs || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${(item.fat || 0).toFixed(1)}</td>
                    <td class="nutrition-cell">${item.meal_count || 0}</td>
                </tr>
            `).join('');

            document.getElementById('group-content').innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th class="check-cell">Default</th>
                            <th>Item</th>
                            <th>Unit</th>
                            <th>Kcal</th>
                            <th>Protein</th>
                            <th>Carbs</th>
                            <th>Fat</th>
                            <th>Meals</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;

            document.getElementById('items-card').style.display = 'none';
            document.getElementById('group-fab').style.display = 'none';
            document.getElementById('group-view').classList.add('show');
        }

        function renderGroupView() {
            showGroupView();
        }

        function cancelGroup() {
            document.getElementById('group-view').classList.remove('show');
            document.getElementById('items-card').style.display = '';
            updateGroupFab();
        }

        async function commitGroup() {
            if (!groupDefaultId) {
                alert('Select a default item first');
                return;
            }

            const itemIds = Array.from(selectedItems.keys());
            const btn = document.getElementById('commit-group-btn');
            btn.disabled = true;
            btn.textContent = 'Grouping...';

            try {
                const res = await fetch('/api/items/group', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        default_item_id: groupDefaultId,
                        item_ids: itemIds
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Failed to group items');
                }

                const data = await res.json();
                alert(`Grouped successfully! ${data.meals_updated} meal reference(s) updated.`);

                // Reset state
                selectedItems.clear();
                groupDefaultId = null;
                cancelGroup();
                loadItems(currentOffset, currentSearch);
            } catch (e) {
                alert(e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Commit Group';
            }
        }

        function updatePagination() {
            const pagination = document.getElementById('pagination');

            if (currentSearch || totalItems <= PAGE_SIZE) {
                pagination.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(totalItems / PAGE_SIZE);
            const currentPage = Math.floor(currentOffset / PAGE_SIZE) + 1;

            pagination.innerHTML = `
                <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
                <span class="page-info">Page ${currentPage} of ${totalPages}</span>
                <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
            `;
        }

        function goToPage(page) {
            const offset = (page - 1) * PAGE_SIZE;
            loadItems(offset, currentSearch);
        }

        function searchItems() {
            const search = document.getElementById('search-input').value.trim();
            loadItems(0, search);
        }

        function toggleSort(col) {
            if (currentSort === col) {
                currentDir = currentDir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort = col;
                currentDir = col === 'created_at' ? 'desc' : 'asc';
            }
            loadItems(0, currentSearch);
        }

        function formatCreatedAt(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const now = new Date();
            const diffMs = now - d;
            const diffDays = Math.floor(diffMs / 86400000);
            if (diffDays === 0) return 'today';
            if (diffDays === 1) return '1d ago';
            if (diffDays < 30) return diffDays + 'd ago';
            if (diffDays < 365) {
                const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                return months[d.getMonth()] + ' ' + d.getDate();
            }
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Handle Enter key in search
        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchItems();
            }
        });

        // Initial load
        loadItems();
    </script>
</body>
</html>
